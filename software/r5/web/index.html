<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KR260 · Ethernet switch</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101820;color:#e6edf3}body{max-width:1280px;margin:0 auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #344452;padding-bottom:20px}h1{font-size:24px;margin:0}h2{font-size:19px;margin-top:32px}nav a{color:#9fd8ef;margin-left:24px}a[aria-current]{color:white;font-weight:bold}p{color:#afbecb;line-height:1.6}.panel{background:#17232e;border:1px solid #344452;border-radius:12px;padding:22px;margin:24px 0;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{text-align:right;padding:12px;border-bottom:1px solid #344452}th:first-child,td:first-child{text-align:left}th{color:#9eafbf;font-weight:500}button{background:#9fe2c0;color:#102c20;padding:12px 22px;border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{width:20px;height:20px;accent-color:#9fe2c0}.ok{color:#9fe2c0}.bad{color:#ffad9e}#status{min-height:24px}small{color:#afbecb}td{font-variant-numeric:tabular-nums}footer{margin:32px 0;color:#afbecb}@media(max-width:600px){body{padding:16px}header{display:block}nav{margin-top:20px}nav a{margin:0 24px 0 0}}
/* Keep complete dotted-decimal addresses visible, including on narrow screens. */
.ipv4-field,.credential-field{display:inline-flex;flex-direction:column;gap:6px;margin:8px 16px 8px 0;vertical-align:top}
.ipv4-field input{box-sizing:border-box;width:18ch;height:auto;padding:6px 8px;font:15px ui-monospace,monospace}
#current-ipv4 h2{margin-top:0}.ipv4-summary{display:flex;flex-wrap:wrap;gap:16px 40px;margin:0}.ipv4-summary dt{color:#afbecb;margin-bottom:6px}.ipv4-summary dd{margin:0;font:18px ui-monospace,monospace}
.credential-field input{box-sizing:border-box;width:26ch;height:auto;padding:6px 8px;font:inherit}
</style>
<header><h1>KR260 <small>/ Ethernet switch</small></h1><nav><a href="/configuration">Configuration</a><a href="/statistics">Statistics</a><a href="/mac-table">MAC table</a></nav></header>
<p id="status" role="status" aria-live="polite">Connecting…</p><main id="content"></main><footer>R5 management · No login required</footer>
<script>
'use strict';
const ports=['GEM0 · Right upper','GEM1 · Right lower','PL0 · Left upper','PL1 · Left lower','SFP','CPU virtual port'];
const portCols=['RX good packets','RX bad packets','RX good bytes','RX bad bytes','TX good packets','TX bad packets','TX good bytes','TX bad bytes'];
const ddrCols=['Bytes','Bursts','Latency sum (cycles)','Max latency (cycles)','Address stalls (cycles)','Data stalls (cycles)','AXI errors','Outstanding (cycles)'];
const debugNames=['GEM0 ingress stall','GEM1 ingress stall','PL0 ingress stall','PL1 ingress stall','SFP ingress stall','GEM0 egress stall','GEM1 egress stall','PL0 egress stall','PL1 egress stall','SFP egress stall','CPU to fabric stall','Fabric to CPU stall','CPU allocation wait','CPU enqueue wait','Link flush busy','Combined AXI errors'];
const stpStates=['Disabled','Blocking','Listening','Learning','Forwarding'];
const stpRoles=['Disabled','Root','Designated','Alternate','Backup'];
const content=document.querySelector('#content'),status=document.querySelector('#status');
const config=location.pathname==='/configuration',macTable=location.pathname==='/mac-table';
document.querySelector(`a[href="/${config?'configuration':macTable?'mac-table':'statistics'}"]`).setAttribute('aria-current','page');
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function table(title,headers,rows){return `<section class="panel"><h2>${esc(title)}</h2><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>'<tr>'+row.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>').join('')}</tbody></table></section>`;}
async function api(path,options={}){const {timeoutMs=5000,...fetchOptions}=options;const r=await fetch(path,{...fetchOptions,cache:'no-store',signal:AbortSignal.timeout(timeoutMs)});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json();}
function speed(n,i){return i===5?'Virtual':n?`${n} Mb/s full duplex`:'No supported link';}
let busy=false;
async function loadConfig(){
 const [p,c,n]=await Promise.all([api('/api/ports'),api('/api/config'),api('/api/network')]);
 content.innerHTML='<section class="panel" id="current-ipv4"><h2>Current IPv4</h2><p id="current-ipv4-state"></p><dl class="ipv4-summary"><div><dt>IP address</dt><dd id="current-ip">—</dd></div><div><dt>Netmask</dt><dd id="current-netmask">—</dd></div><div><dt>Default gateway</dt><dd id="current-gateway">—</dd></div></dl></section><h2>Saved configuration</h2><p>Save writes settings to the microSD card. A card with a FAT filesystem must be inserted to save. Port changes apply after saving; IP mode, address, netmask and default route take effect after a firmware restart. GEM0 supports only 1000 Mb/s. GEM1 and both PL copper ports support 10/100/1000 Mb/s full duplex. '+((c.sfp_supported??[]).includes(1000)&&(c.sfp_supported??[]).includes(10000)?'SFP Auto probes 10G and 1G, retaining the rate that establishes a link. Forced 1G or 10G changes the host protocol without reloading the FPGA. Switching briefly interrupts this port.':'SFP Auto uses the installed build’s host rate ('+(c.sfp_supported?.[1]??1000)+' Mb/s).')+' This is not the copper speed inside an RJ45 module. Selecting only unsupported speeds disables that port until supporting hardware is installed.</p><div class="panel"><table><thead><tr><th>Port</th><th>Enabled</th><th>Physical link</th><th>Link admitted</th><th>Link speed</th><th>Requested full-duplex speeds</th></tr></thead><tbody>'+ports.slice(0,5).map((name,i)=>`<tr><td>${esc(name)}</td><td><input type="checkbox" aria-label="Enable ${esc(name)}" data-port="${i}" ${c.admin&(1<<i)?'checked':''}></td><td data-physical="${i}">${p.physical&(1<<i)?'Up':'Down'}</td><td data-forwarding="${i}">${p.forwarding&(1<<i)?'Active':'Inactive'}</td><td data-speed="${i}">${speed(p.speed_mbps[i],i)}</td><td>${i<4?[10,100,1000].map((n,b)=>`<label><input type="checkbox" aria-label="${esc(name)} advertise ${n} Mb/s" data-adv-port="${i}" data-bit="${1<<b}" ${c.advertise[i]&(1<<b)?'checked':''} ${i===0?'disabled':''}> ${n}</label>`).join(' '):`<select id="sfp" aria-label="SFP speed">${[[0,(c.sfp_supported??[]).length>2?'Auto (1G / 10G)':'Auto (build host rate)'],[1000,'1G'],[2500,'2.5G'],[5000,'5G'],[10000,'10G']].map(([v,t])=>`<option value="${v}" ${c.sfp===v?'selected':''}>${t}${(c.sfp_supported??[0,1000]).includes(v)?'':' (unsupported by build)'}</option>`).join('')}</select>`}</td></tr>`).join('')+'</tbody></table></div>';
 content.innerHTML+=`<section class="panel"><h2>Spanning tree</h2><label><input id="stp-enabled" type="checkbox" ${c.stp?'checked':''}> Enable spanning tree</label> <label>Protocol <select id="stp-version" aria-label="Protocol"><option value="0" ${c.stp_version===0?'selected':''}>Classic STP (802.1D)</option><option value="2" ${c.stp_version===2?'selected':''}>Rapid STP (RSTP / 802.1w)</option></select></label><p>Applies after saving and survives restart. Enabling or changing protocol restarts tree convergence and may temporarily interrupt connectivity. RSTP interoperates with classic STP neighbors. All ports use automatic full-duplex point-to-point detection; edge forwarding is not enabled. Disabling spanning tree allows loops if redundant cables are present.</p></section>`;
 content.innerHTML+=`<section class="panel"><h2>Management IPv4</h2><label class="ipv4-field">Address mode <select id="ip-mode"><option value="1" ${c.dhcp?'selected':''}>DHCP</option><option value="0" ${c.dhcp?'':'selected'}>Static</option></select></label> <label class="ipv4-field">IP address <input id="ip" value="${esc(c.ip)}" maxlength="15"></label> <label class="ipv4-field">Netmask <input id="netmask" value="${esc(c.netmask)}" maxlength="15"></label> <label class="ipv4-field">Default route <input id="gateway" value="${esc(c.gateway)}" maxlength="15"></label><p>Static mode requires a unicast host address and contiguous /1–/30 mask. Use 0.0.0.0 for no default route; otherwise the gateway must be another host in the same subnet. Restart to apply IP changes.</p></section>`;
 content.innerHTML+=table('Permanent board MAC allocation',['Use','MAC'],c.macs.map((m,i)=>[i===0?'CPU management / bridge identity':'Reserved',m]));
 content.innerHTML+=`<section class="panel"><h2>Authorize changes</h2><p>Viewing stays public. Saving requires administrator credentials (factory default admin / admin). This HTTP connection is not encrypted.</p><label class="credential-field">Administrator <input id="auth-user" autocomplete="username" value="${esc(c.username)}" maxlength="31"></label> <label class="credential-field">Password <input id="auth-password" type="password" autocomplete="current-password" maxlength="128"></label></section><p>Storage: ${c.saved?'saved record loaded':'factory defaults, not yet saved'}; ${c.writable?'available':'unavailable or configuration files unrecognized'}. Disabling your management port can disconnect this page; saved disables survive restart.</p><button id="save" ${c.writable?'':'disabled'}>Save settings</button> <button id="reload">Reload status</button>`;
 document.querySelector('#save').onclick=save;document.querySelector('#reload').onclick=()=>loadConfig().catch(failed);
 renderCurrentIPv4(n);
 status.textContent='Configuration loaded';status.className='ok';
}
async function save(){if(busy)return;busy=true;const button=document.querySelector('#save');button.disabled=true;
 let mask=0;document.querySelectorAll('input[data-port]').forEach(e=>{if(e.checked)mask|=1<<Number(e.dataset.port);});
 const adv=[0,0,0,0];document.querySelectorAll('input[data-adv-port]').forEach(e=>{if(e.checked)adv[Number(e.dataset.advPort)]|=Number(e.dataset.bit);});
 if(adv.some(n=>!n)){status.textContent='Select at least one advertised speed for each copper port.';status.className='bad';busy=false;button.disabled=false;return;}
 const user=document.querySelector('#auth-user').value,password=document.querySelector('#auth-password').value;
 if(!user||!password){status.textContent='Enter administrator credentials to save.';status.className='bad';busy=false;button.disabled=false;return;}
 const authorization='Basic '+btoa(String.fromCharCode(...new TextEncoder().encode(user+':'+password)));
 const body=new URLSearchParams({stp:document.querySelector('#stp-enabled').checked?1:0,stp_version:document.querySelector('#stp-version').value,mask,adv0:adv[0],adv1:adv[1],adv2:adv[2],adv3:adv[3],sfp:document.querySelector('#sfp').value,dhcp:document.querySelector('#ip-mode').value,ip:document.querySelector('#ip').value,netmask:document.querySelector('#netmask').value,gateway:document.querySelector('#gateway').value});
 try{await api('/api/config',{method:'POST',timeoutMs:20000,headers:{'Content-Type':'application/x-www-form-urlencoded','X-KR260-Request':'1','Authorization':authorization},body:body.toString()});status.textContent='Settings saved. Restart firmware to apply IP changes. Updating port status…';setTimeout(()=>loadConfig().catch(failed),750);}catch(e){failed(e);}finally{document.querySelector('#auth-password').value='';busy=false;button.disabled=false;}}
function failed(e){status.textContent=`Unable to refresh: ${e.message}. Displayed values may be stale.`;status.className='bad';}
async function refresh(){if(busy)return;busy=true;try{
 const s=await api('/api/statistics');
 let html=`<h2>Statistics</h2><p>Refreshes every second · Cumulative totals since firmware restart · Counter reads do not clear these totals. DDR and debug cycle counts use ${s.fabric_hz?`${esc(s.fabric_hz/1e6)} MHz (${esc(1e9/s.fabric_hz)} ns/cycle)`:'an unavailable fabric clock frequency'}.</p>`;
 html+=table('Ethernet ports',['Port','Link speed',...portCols],s.ports.map((v,i)=>[ports[i],speed(s.speed_mbps[i],i),...v]));
 html+='<p>CPU RX is processor → fabric; CPU TX is fabric → processor.</p>';
 const st=s.stp;
 if(st.fault)html+='<p class="bad">Spanning-tree hardware fault: forwarding remains blocked until restart.</p>';
 if(!st.enabled){
  html+=`<section class="panel"><h2>Spanning tree</h2><p><strong>Disabled.</strong> Selected protocol: ${st.version===2?'RSTP':'Classic STP'}. Change this on the Configuration page.</p></section>`;
 }else{
  html+=`<section class="panel"><h2>Spanning tree · ${st.version===2?'RSTP':'Classic STP'}</h2><p>Bridge ${esc(st.bridge_mac)} priority ${st.bridge_priority} · Root ${esc(st.root_mac)} priority ${st.root_priority}${st.is_root?' (this bridge)':''} · Root path cost ${st.root_path_cost} · Root port ${st.root_port<0?'none (root)':ports[st.root_port]} · Topology changes ${st.topology_changes} · TCN BPDUs seen ${st.tcn_rx} · RX rejected/dropped ${st.rx_dropped} · TX failures ${st.tx_failed}</p></section>`;
  html+=table('Spanning Tree ports',['Port','Role','State','Link','Path cost','BPDUs RX','BPDUs TX','Role changes'],
    st.ports.map((p,i)=>[ports[i],stpRoles[p.role],stpStates[p.state],p.link_up?'Up':'Down',p.path_cost,p.bpdu_rx,p.bpdu_tx,p.role_changes]));
 }
 if(s.ddr)html+=table('Fabric ↔ DDR',['Direction',...ddrCols],s.ddr.map((v,i)=>[['Physical ingress write','Physical egress read','CPU write','CPU read'][i],...v]));
 if(s.debug)html+=table('Debug counters',['Counter','Total (cycles, except AXI errors)'],s.debug[0].map((v,i)=>[debugNames[i],v]));
 const health=['capabilities','polls','age_ms','late_polls','saturated_reads','read_timeouts','release_timeouts','response_timeouts','last_release_index','last_release_target_index','last_response_index'];
 const bankNames=['GEM0 RX','GEM0 TX','GEM1 RX','GEM1 TX','PL0','PL1','SFP','CPU','Physical ingress write','Physical egress read','CPU write','CPU read','Debug'];
 const bankStates=['Not built','Current','Clock unavailable — stale','Clock active, read fault — stale','Not sampled'];
 html+=table('Statistics availability',['Bank','Status','Last complete collection (ms ago)','Clock-unavailable episodes','Active-clock timeouts'],(s.banks||[]).map((b,i)=>[bankNames[i],bankStates[b[0]]||'Unknown',b[1]===4294967295?'Never':b[1],b[2],b[3]]));
 html+='<p>Unavailable banks retain their accumulated totals. Other banks continue updating. Clock-unavailable episodes are separate from collector faults.</p>';
 html+=table('Collector health',['Field','Value'],health.map(k=>[k,k.startsWith('last_')&&s[k]===4294967295?'None':s[k]]));
 html+=table('Timeout locations',['Bank','Slot','Release timeouts','Response timeouts'],s.timeouts);
 const v=s.sensors, valid=(bit,value,unit)=>v.valid_mask&bit?`${value} ${unit}`:'Unavailable';
 let sensors=[['PS temperature',valid(1,(v.temperature_mc[0]/1000).toFixed(1),'°C')],['PL temperature',valid(2,(v.temperature_mc[1]/1000).toFixed(1),'°C')]];
 v.voltage_uv.forEach((n,i)=>sensors.push([['PS LP','PS FP','PS AUX','PL INT','PL AUX','PL BRAM'][i],valid(i<3?1:2,(n/1e6).toFixed(3),'V')]));
 sensors.push(['SOM current',valid(4,(v.som_current_ua/1e6).toFixed(3),'A')],['SOM voltage',valid(4,(v.som_voltage_uv/1e6).toFixed(3),'V')],['SOM power',valid(4,v.som_power_uw/1e6,'W')],['Sensor errors',v.errors],['Sensor age (ms)',v.age_ms]);
 html+=table('Temperature, voltage & power',['Sensor','Value'],sensors);content.innerHTML=html;
 status.textContent=s.available?`Updated ${new Date().toLocaleTimeString()}`:'Statistics unavailable: check firmware and FPGA counter options';status.className=s.available?'ok':'bad';
 }catch(e){failed(e);}finally{busy=false;}}
let statusBusy=false;
function renderCurrentIPv4(n){
 const panel=document.querySelector('#current-ipv4');if(!panel)return;
 panel.querySelector('#current-ipv4-state').textContent=`${n.up?'Active':'Network down'} · ${n.dhcp?'DHCP':'Static'} · Refreshes every second`;
 for(const key of ['ip','netmask','gateway'])panel.querySelector(`#current-${key}`).textContent=n.up?n[key]:'Unavailable';
}
async function refreshPortStatus(){
 if(busy||statusBusy)return;statusBusy=true;
 try{const [p,n]=await Promise.all([api('/api/ports'),api('/api/network')]);
 renderCurrentIPv4(n);
 document.querySelectorAll('[data-physical]').forEach(e=>{e.textContent=p.physical&(1<<Number(e.dataset.physical))?'Up':'Down';});
 document.querySelectorAll('[data-forwarding]').forEach(e=>{e.textContent=p.forwarding&(1<<Number(e.dataset.forwarding))?'Active':'Inactive';});
 document.querySelectorAll('[data-speed]').forEach(e=>{const i=Number(e.dataset.speed);e.textContent=speed(p.speed_mbps[i],i);});
 }catch(e){failed(e);}finally{statusBusy=false;}
}

function macLayout(){
 content.innerHTML='<h2>MAC address table</h2><p>Refresh is manual. Opening this page does not scan hardware. A refresh reads the live table while learning and forwarding continue; the rows are not an atomic snapshot. Ages shown are remaining seconds when captured, not a countdown. IPv4 addresses are learned passively from ARP; observations expire after 10 minutes. Last observed is measured when this page is loaded. Unknown means no mapping is available, not that the device has no IP address.</p><button id="mac-refresh">Refresh MAC table</button><p id="mac-info">No snapshot captured yet.</p><div id="mac-rows"></div>';
 document.querySelector('#mac-refresh').onclick=()=>loadMac(true);
}
async function loadMac(requestRefresh=false){
 if(busy)return;busy=true;const button=document.querySelector('#mac-refresh');button.disabled=true;
 try{
  let s=await api('/api/mac-table',requestRefresh?{method:'POST',headers:{'X-KR260-Request':'1','Content-Type':'application/x-www-form-urlencoded'},body:'refresh=1'}:{});
  // Poll only the manually requested operation; GET never starts a scan.
  if(requestRefresh){
   const deadline=Date.now()+10000;
   while(s.busy && Date.now()<deadline){
    status.textContent='Reading MAC table… Previous snapshot remains visible.';
    await new Promise(resolve=>setTimeout(resolve,250));
    s=await api('/api/mac-table');
   }
  }
  if(s.busy){status.textContent='Refresh pending. Click Refresh MAC table to check again; an in-flight scan will be reused.';return;}
  const dumpError=s.error;
  if(dumpError && !s.ready)throw Error('MAC dump error '+dumpError);
  if(!s.ready){status.textContent='Click Refresh MAC table to capture the first snapshot.';return;}
  const rows=[];
  for(let page=0;page<s.pages;page++){
   const part=await api('/api/mac-table/'+page);
   if(part.generation!==s.generation)throw Error('Snapshot changed in another browser. Click Refresh MAC table again.');
   rows.push(...part.entries);
  }
  document.querySelector('#mac-info').textContent=`${s.count} learned entries · Snapshot ${s.generation} · Captured ${(s.age_ms/1000).toFixed(1)} seconds before this load. No automatic refresh.`;
  document.querySelector('#mac-rows').innerHTML=table('Learned addresses',['Bank / row','MAC address','Ports','Age at capture (s)','IPv4 addresses','Last observed'],rows.map(([i,mac,mask,age,ips=[]])=>[`${Math.floor(i/512)} / ${i%512}`,mac,ports.filter((_,p)=>mask&(1<<p)).join(', ')||'None',age,ips.length?ips.map(x=>x[0]).join(', '):'Unknown',ips.length?ips.map(x=>x[1]===null?'Unknown (ARP cache)':(x[1]/1000).toFixed(1)+' s ago').join(', '):'Unknown']));
  if(dumpError)throw Error('MAC dump error '+dumpError+'; showing previous snapshot');
  status.textContent='MAC snapshot loaded. Click Refresh MAC table to update.';status.className='ok';
 }catch(e){failed(e);}finally{busy=false;button.disabled=false;}
}
if(macTable){macLayout();loadMac();}else if(config){loadConfig().catch(failed);setInterval(refreshPortStatus,1000);}else{refresh();setInterval(refresh,1000);}
</script></html>
